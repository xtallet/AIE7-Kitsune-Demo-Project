[project]
name = "inari-henzuru-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.5,<3.13"
#packages = [
#    { include = "app", from = "." }
#]
dependencies = [
    "agno>=1.4.5",
    "dotenv>=0.9.9",
    "lancedb>=0.22.0",
    "openai>=1.77.0",
    "pandas>=2.2.3",
    "psycopg>=3.2.9",
    "pydantic-settings>=2.9.1",
    "python-dotenv>=1.1.0",
    "redis>=6.0.0",
    "requests>=2.32.3",
    "ray[serve]==2.32.0",
    "transformers[torch]>=4.52.3",
    "pydantic>=2.11.4",
    "psycopg-binary>=3.2.9",
    "guardrails-ai==0.6.6",
    "azure-ai-inference>=1.0.0b9",
    "asyncio>=3.4.3",
    "psycopg2-binary>=2.9.10",
    "numpy==1.26.4",
    "scipy==1.13.0",
]

[dependency-groups]
dev = [
    "faker>=25.9.2",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
    "pytest-mock>=3.14.0",
]

[tool.skjold]
report_only = true
report_format = 'cli'
sources = ["pyup", "gemnasium"]
cache_dir = ".skjold_cache"
cache_expires = 43200
ignore_file = ".skjoldignore"

[tool.pytest.ini_options]
python_files = "test_* *_tests.py *_utests.py"
python_classes = "Test* *Tests"

[tool.setuptools.packages.find]
where = ["."]
include = ["app"]
