[project]
name = "inari-henzuru-data"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "agno>=1.4.5",
    "lancedb>=0.22.0",
    "pandas>=2.2.3",
    "pydantic-settings>=2.9.1",
    "python-dotenv>=1.1.0",
    "redis>=6.0.0",
    "pydantic>=2.11.4",
    "numpy==1.26.4",
    "pymongo>=4.13.2",
    "fastapi>=0.116.1",
    "uvicorn>=0.35.0",
    "nltk>=3.9.1",
    "langgraph>=0.6.0",
    "langsmith>=0.4.8",
    "langchain>=0.3.27",
    "psycopg>=3.2.9",
    "langchain-openai>=0.3.28",
    "openinference-instrumentation-agno>=0.1.10",
    "opentelemetry-sdk>=1.36.0",
    "opentelemetry-exporter-otlp>=1.36.0",
    "aiohttp>=3.12.15",
    "langgraph-sdk>=0.2.0",
    "langgraph-cli[inmem]>=0.3.6",
    "jupyter>=1.1.1",
    "langchain-community>=0.3.27",
    "jq>=1.10.0",
    "ragas>=0.3.1",
    "pillow>=11.3.0",
    "rapidfuzz>=3.13.0",
    "qdrant-client>=1.15.1",
]

[dependency-groups]
dev = [
    "faker>=25.9.2",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
    "pytest-mock>=3.14.0",
]

[tool.skjold]
report_only = true
report_format = 'cli'
sources = ["pyup", "gemnasium"]
cache_dir = ".skjold_cache"
cache_expires = 43200
ignore_file = ".skjoldignore"

[tool.pytest.ini_options]
python_files = "test_* *_tests.py *_utests.py"
python_classes = "Test* *Tests"

[tool.setuptools.packages.find]
where = ["."]
include = ["app"]
